<svg width="1200" height="220" viewBox="0 0 1200 220" xmlns="http://www.w3.org/2000/svg" font-family="SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#05030f"/>
      <stop offset="55%" stop-color="#0d0221"/>
      <stop offset="100%" stop-color="#120522"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="48%" stop-color="#9d4edd"/>
      <stop offset="100%" stop-color="#ff2079"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#9d4edd" stroke-width="0.45" opacity="0.16"/>
    </pattern>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#000" opacity="0.24"/>
    </pattern>
    <filter id="cyanGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="pinkGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00f0ff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#ff2079" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="clip"><rect width="1200" height="220" rx="12"/></clipPath>
  </defs>

  <rect width="1200" height="220" rx="12" fill="url(#bg)"/>
  <g clip-path="url(#clip)">
    <rect width="1200" height="220" fill="url(#grid)"/>
    <rect width="1200" height="220" fill="url(#scan)"/>
    <rect x="-380" y="0" width="380" height="220" fill="url(#sweep)">
      <animate attributeName="x" values="-380;1200" dur="7s" repeatCount="indefinite"/>
    </rect>
  </g>

  <rect x="12" y="12" width="1176" height="196" rx="8" fill="none" stroke="#2a1743"/>
  <path d="M12 54 V12 H54" fill="none" stroke="#00f0ff" stroke-width="2" filter="url(#cyanGlow)"/>
  <path d="M1146 208 H1188 V166" fill="none" stroke="#ff2079" stroke-width="2" filter="url(#pinkGlow)"/>
  <line x1="74" y1="154" x2="1126" y2="154" stroke="url(#neon)" stroke-width="1" opacity="0.75"/>

  <text x="74" y="62" font-size="11" letter-spacing="2.6" fill="#6e5a8a">SYSTEM_PROFILE // GH://HAMZAHGHAZI2001</text>
  <text x="74" y="116" font-size="44" font-weight="700" letter-spacing="2.5" fill="#e9faff">HAMZA GHAZI</text>
  <text x="74" y="142" font-size="14" letter-spacing="2.2" fill="#00f0ff" filter="url(#cyanGlow)">PYTHON // BACKEND SYSTEMS // APPLICATION SECURITY</text>

  <circle cx="78" cy="183" r="4" fill="#ff2079" filter="url(#pinkGlow)">
    <animate attributeName="opacity" values="1;0.25;1" dur="1.5s" repeatCount="indefinite"/>
  </circle>
  <text x="92" y="188" font-size="11" letter-spacing="1.7" fill="#9d4edd">STATUS: BUILDING</text>
  <text x="1126" y="188" text-anchor="end" font-size="10" letter-spacing="1.6" fill="#6e5a8a">CYBERDECK // v3</text>
</svg>
