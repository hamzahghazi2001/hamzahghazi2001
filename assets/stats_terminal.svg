<svg width="1200" height="270" viewBox="0 0 1200 270" xmlns="http://www.w3.org/2000/svg" font-family="SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#05030f"/>
      <stop offset="50%" stop-color="#0d0221"/>
      <stop offset="100%" stop-color="#120522"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#9d4edd" stroke-width="0.4" opacity="0.14"/>
    </pattern>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#000" opacity="0.24"/>
    </pattern>
    <filter id="cyanGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="pinkGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="50%" stop-color="#9d4edd"/>
      <stop offset="100%" stop-color="#ff2079"/>
    </linearGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00f0ff" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#ff2079" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="clip"><rect width="1200" height="270" rx="12"/></clipPath>
  </defs>

  <rect width="1200" height="270" rx="12" fill="url(#bg)"/>
  <g clip-path="url(#clip)">
    <rect width="1200" height="270" fill="url(#grid)"/>
    <rect width="1200" height="270" fill="url(#scan)"/>
    <rect x="-320" y="0" width="320" height="270" fill="url(#sweep)">
      <animate attributeName="x" values="-320;1200" dur="6.5s" repeatCount="indefinite"/>
    </rect>
  </g>

  <rect x="12" y="12" width="1176" height="246" rx="8" fill="none" stroke="#2a1743"/>
  <path d="M12 50V12H50" fill="none" stroke="#00f0ff" stroke-width="2" filter="url(#cyanGlow)"/>
  <path d="M1150 258H1188V220" fill="none" stroke="#ff2079" stroke-width="2" filter="url(#pinkGlow)"/>

  <text x="42" y="48" font-size="11" letter-spacing="2.2" fill="#6e5a8a">GH://ACTIVITY_TELEMETRY</text>
  <text x="1158" y="48" text-anchor="end" font-size="10" letter-spacing="1.8" fill="#6e5a8a">SNAPSHOT // 2026</text>
  <line x1="42" y1="66" x2="1158" y2="66" stroke="url(#line)" stroke-width="1" opacity="0.75"/>

  <!-- five horizontal metric cells -->
  <g>
    <rect x="42"  y="88" width="204" height="100" rx="5" fill="#080518" stroke="#24304a"/>
    <rect x="268" y="88" width="204" height="100" rx="5" fill="#080518" stroke="#24304a"/>
    <rect x="494" y="88" width="204" height="100" rx="5" fill="#080518" stroke="#24304a"/>
    <rect x="720" y="88" width="204" height="100" rx="5" fill="#080518" stroke="#24304a"/>
    <rect x="946" y="88" width="212" height="100" rx="5" fill="#080518" stroke="#24304a"/>
  </g>

  <g text-anchor="middle">
    <text x="144" y="118" font-size="10" letter-spacing="1.6" fill="#796991">STARS</text>
    <text x="144" y="159" font-size="28" font-weight="700" fill="#00f0ff" filter="url(#cyanGlow)">0</text>

    <text x="370" y="118" font-size="10" letter-spacing="1.6" fill="#796991">COMMITS_2026</text>
    <text x="370" y="159" font-size="28" font-weight="700" fill="#ff2079" filter="url(#pinkGlow)">77</text>

    <text x="596" y="118" font-size="10" letter-spacing="1.6" fill="#796991">PULL_REQUESTS</text>
    <text x="596" y="159" font-size="28" font-weight="700" fill="#9d4edd">5</text>

    <text x="822" y="118" font-size="10" letter-spacing="1.6" fill="#796991">ISSUES</text>
    <text x="822" y="159" font-size="28" font-weight="700" fill="#00f0ff" filter="url(#cyanGlow)">1</text>

    <text x="1052" y="118" font-size="10" letter-spacing="1.6" fill="#796991">REPOS_CONTRIBUTED</text>
    <text x="1052" y="159" font-size="28" font-weight="700" fill="#ff2079" filter="url(#pinkGlow)">1</text>
  </g>

  <line x1="42" y1="210" x2="1158" y2="210" stroke="#2a1743"/>
  <circle cx="48" cy="232" r="3.5" fill="#00f0ff" filter="url(#cyanGlow)">
    <animate attributeName="opacity" values="1;0.25;1" dur="1.5s" repeatCount="indefinite"/>
  </circle>
  <text x="61" y="236" font-size="10.5" letter-spacing="1.4" fill="#00f0ff">STATUS: ONLINE</text>
  <text x="600" y="236" text-anchor="middle" font-size="10.5" letter-spacing="1.3" fill="#9d4edd">PINNED_PROCESS // hybridAUTH.exe</text>
  <text x="1158" y="236" text-anchor="end" font-size="10" letter-spacing="1.3" fill="#796991">FIDO2 // PYTEST // BACKEND</text>
</svg>
